name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted: this is a public repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "needs gofmt:"; echo "$out"; exit 1; fi
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit tests (acceptance tests need TF_ACC and are not run here)
        run: go test -race ./...

  # Proves the release configuration on every push without a tag or the real
  # key: GoReleaser builds every platform and signs the checksum file with a
  # throwaway key, and the layout the registries read is checked.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - name: throwaway signing key
        id: key
        run: |
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key "Release dry run <dry-run@example.com>" rsa4096 sign never
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          echo "fingerprint=$fpr" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --snapshot --clean --skip=publish
        env:
          GPG_FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
      - name: release layout and signature
        run: |
          cd dist
          ls
          sums=$(ls *_SHA256SUMS)
          name=${sums%_SHA256SUMS}
          test -f "$sums.sig"
          # the manifest is listed in the checksums; a real release uploads the file itself
          grep -q "${name}_manifest.json" "$sums"
          for os_arch in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 freebsd_amd64; do
            grep -q "${name}_${os_arch}.zip" "$sums" || { echo "missing $os_arch"; exit 1; }
          done
          sha256sum -c "$sums" --ignore-missing
          gpg --verify "$sums.sig" "$sums"
